<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<!-- Исходник OG-превью 1200×630. Рендер: headless Chrome --window-size=1200,630 --screenshot.
     Картинка вечнозелёная: чисел и дат не зашивать (страница пополняется с каждым потоком). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zalando+Sans+Expanded:wght@400;500;600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{font-family:'Poppins',Arial,sans-serif;color:#1D1D1F;position:relative;
       background:linear-gradient(135deg,#F2F5FC 0%,#FFFFFF 62%,#EEF1FB 100%)}
  .rings{position:absolute;border-radius:50%;border:2px solid rgba(61,61,240,.07);pointer-events:none}
  .r1{width:820px;height:820px;left:-320px;top:-260px}
  .r2{width:560px;height:560px;left:-180px;top:-120px}
  .in{position:relative;height:100%;display:flex;align-items:center;gap:60px;padding:0 72px}
  .left{flex:1;min-width:0}
  .logo{font-family:'Zalando Sans Expanded',Arial,sans-serif;font-size:26px;letter-spacing:.14em;
        color:#1D1D1F;margin-bottom:40px}
  .eyebrow{display:inline-flex;align-items:center;gap:12px;font-size:16px;font-weight:500;
        letter-spacing:.07em;text-transform:uppercase;color:#3D3DF0;margin-bottom:24px}
  .eyebrow::before{content:'';width:32px;height:3px;border-radius:3px;flex:0 0 auto;
        background:linear-gradient(118deg,#3F64F0 0%,#3D3DF0 52%,#27009A 100%)}
  h1{font-family:'Zalando Sans Expanded',Arial,sans-serif;font-weight:600;font-size:50px;
     line-height:1.12;color:#1D1D1F;letter-spacing:-.015em;margin-bottom:26px}
  .sub{font-size:23px;line-height:1.5;color:#6B6B70;max-width:520px}
  .sub b{color:#1D1D1F;font-weight:500}
  .pill{display:inline-flex;align-items:center;margin-top:36px;font-size:20px;font-weight:500;color:#fff;
        background:linear-gradient(118deg,#3F64F0 0%,#3D3DF0 52%,#27009A 100%);
        border-radius:10px;padding:16px 34px;box-shadow:0 14px 38px rgba(61,61,240,.32)}
  .mosaic{flex:0 0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:420px}
  .mosaic img{width:132px;height:132px;object-fit:cover;border-radius:18px;display:block;
        box-shadow:0 10px 26px rgba(29,29,31,.14)}
</style>
</head>
<body>
  <i class="rings r1"></i><i class="rings r2"></i>
  <div class="in">
    <div class="left">
      <div class="logo">IAKUBAN</div>
      <div class="eyebrow">Истории выпускников</div>
      <h1>Видеоотзывы выпускников первой ступени</h1>
      <p class="sub">Аккредитация ICF, Level&nbsp;1 · программа «Магия и наука коучинга». <b>Истории записаны в день вручения сертификатов</b>, без сценария</p>
      <span class="pill">Смотреть истории</span>
    </div>
    <div class="mosaic">
      <img src="people/p3_04_irina_nakonechnaya.jpg" alt="">
      <img src="people/p2_14_polina_kartashova.jpg" alt="">
      <img src="people/p1_01_mariya_silaeva.jpg" alt="">
      <img src="people/p3_09_nursulu_tsupko.jpg" alt="">
      <img src="people/p2_10_mariya_gnitsevich.jpg" alt="">
      <img src="people/p1_07_denis_boyko.jpg" alt="">
      <img src="people/p3_06_nina_marabyan.jpg" alt="">
      <img src="people/p2_12_nataliya_morugina.jpg" alt="">
      <img src="people/p1_19_nataliya_kolpakova.jpg" alt="">
    </div>
  </div>
</body>
</html>
